<style>
/* ---------- 読みこみ中の画面 ----------
 * すぐ開けたときに ちらつかないように、0.3秒たってから見せる。絵は野々宮すみれの水彩。 */
.loading { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #fff; opacity: 1; transition: opacity .3s; }
.loading img, .loading p { opacity: 0; animation: loading-in .4s ease .3s forwards; }
.loading img { width: min(220px, 50vw); height: auto; mix-blend-mode: multiply; }
.loading p { margin: 0; font-size: 14px; letter-spacing: .12em; color: #5a6069; }
.loading p::after { content: "…"; display: inline-block; width: 1em; text-align: left; animation: loading-dots 1.2s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; }
.loading.out { opacity: 0; pointer-events: none; }
@keyframes loading-in { to { opacity: 1; } }
@keyframes loading-dots { from { width: 0; } to { width: 1em; } }
@media (prefers-reduced-motion: reduce) { .loading p::after { animation: none; } }
@media print { .loading { display: none !important; } }
body.shot .loading { display: none; }
</style>
<style id="page-rule"></style>
</head>
<body>

<div id="loading" class="loading" role="status" aria-live="polite">
  <img src="assets/lp/loading.webp" alt="" width="220" height="220" decoding="async">
  <p>読みこんでいます</p>
</div>

<header class="bar">
  <div class="name">マス目プリントメーカー<small>試作</small></div>
  <input id="doc-title" class="title" type="text" aria-label="プリントの名前" spellcheck="false">
<button id="btn-tpl" type="button" class="btn tpl-btn" title="ノートやテンプレートの一覧を開く">テンプレート</button>
  <select id="tpl" hidden aria-hidden="true"><option value=""></option></select>
  <label class="paper-pick">用紙
    <select id="paper" aria-label="用紙の大きさと向き"></select>
  </label>
  <a class="about-link" href="about.html" target="_blank" rel="noopener">使い方と事例</a>
  <div class="sp"></div>
  <div class="cluster">
    <button id="btn-undo" type="button" class="btn ghost" title="元に戻す（⌘Z / Ctrl+Z）">元に戻す</button>
    <button id="btn-redo" type="button" class="btn ghost" title="やり直す（⌘⇧Z / Ctrl+Y）">やり直す</button>
  </div>
  <div class="cluster zoom">
    <button id="zoom-out" type="button" class="btn ghost sq" aria-label="縮小">−</button>
    <span id="zoom-val">100%</span>
    <button id="zoom-in" type="button" class="btn ghost sq" aria-label="拡大">＋</button>
    <button id="zoom-page" type="button" class="btn ghost" title="1ページ全体が見える大きさにする">全体</button>
    <button id="zoom-fit" type="button" class="btn ghost" title="紙の幅を画面の幅に合わせる">ページ幅</button>
  </div>
  <div class="cluster">
    <button id="btn-open" type="button" class="btn ghost">開く</button>
    <button id="btn-save" type="button" class="btn ghost" title="PDF や画像で保存（⌘S / Ctrl+S）" aria-haspopup="menu">保存 ▾</button>
    <button id="btn-print" type="button" class="btn primary">印刷</button>
  </div>
</header>

<div id="panel" class="panel ribbon" aria-label="書式の設定"></div>

<div class="work">
  <nav id="tools" class="tools" aria-label="挿入"></nav>
  <main id="stage" class="stage"><div id="pages"></div></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<textarea id="ime" aria-label="マス目に入れる文字" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
<input id="file-open" type="file" accept=".json,application/json" hidden>
<input id="file-image" type="file" accept="image/*" hidden>
<input id="file-font" type="file" accept=".ttf,.otf,.woff,.woff2" hidden>

<script src="assets/app.bundle.js?v=efcdba0d"></script>
