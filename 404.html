<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>School Stock｜ページが見つかりません</title>
<script>
// 配布ファイル（PDF/ZIP）は 2026-08-10 に School_Stock_files リポジトリへ移した。
// 配布済みのQRコード・note・X の旧リンクをここで新しい置き場へ転送する。
(function () {
  var p = location.pathname;
  if (/^\/School_Stock\/.+\.(pdf|zip)$/i.test(p)) {
    location.replace(p.replace("/School_Stock/", "/School_Stock_files/") + location.search);
  }
})();
</script>
<style>
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
         max-width: 36em; margin: 4em auto; padding: 0 1.5em; color: #333; line-height: 1.9; }
  a { color: #1a6b8a; }
</style>
</head>
<body>
<h1>ページが見つかりません</h1>
<p>お探しのファイルが移動した場合は、自動で新しい場所へ移ります。<br>
数秒たっても始まらないときは、棚のトップからお探しください。</p>
<p><a href="/School_Stock/">School Stock の棚へもどる</a></p>
</body>
</html>
