<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="wcT wcD">
  <title id="wcT">車いすの各部の名前</title>
  <desc id="wcD">車いすを横から見た図。グリップ、背もたれ、アームサポート、座面、ブレーキ、駆動輪（後輪）、ハンドリム、キャスター（前輪）、フットサポート、ティッピングレバーの位置を示している。</desc>
  <style>
    .w   {fill:none;stroke:#22262c;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .tyre{fill:#ffffff;stroke:#8a9099;stroke-width:2.6}
    .spk {fill:none;stroke:#c3c8cf;stroke-width:1.6}
    .rim {fill:none;stroke:#22262c;stroke-width:2.6}
    .pane{fill:#ffffff;stroke:#22262c;stroke-width:3;stroke-linejoin:round}
    .seat{fill:#eef1f6;stroke:#22262c;stroke-width:3;stroke-linejoin:round}
    .ld  {fill:none;stroke:#2b5fd9;stroke-width:1.5}
    .pt  {fill:#2b5fd9}
    .lb  {font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;fill:#2b5fd9;font-weight:700}
  </style>

  <!-- ===== 駆動輪（後輪）：うすく、うしろに ===== -->
  <circle class="tyre" cx="470" cy="288" r="134"/>
  <g class="spk">
    <path d="M470,158 L470,418 M340,288 L600,288"/>
    <path d="M378,196 L562,380 M378,380 L562,196"/>
  </g>
  <!-- ハンドリム（のっている人が まわす わっか） -->
  <circle class="rim" cx="470" cy="288" r="112"/>
  <circle cx="470" cy="288" r="9" fill="#22262c"/>

  <!-- ===== キャスター（前輪） ===== -->
  <circle class="tyre" cx="278" cy="390" r="32" stroke="#22262c" stroke-width="3"/>
  <circle cx="278" cy="390" r="6" fill="#22262c"/>
  <path class="w" d="M278,358 L278,304"/>

  <!-- ===== フレーム ===== -->
  <path class="w" d="M278,304 L470,304"/>
  <path class="w" d="M300,304 L300,232"/>

  <!-- ===== フットサポート ===== -->
  <path class="w" d="M278,320 L242,356"/>
  <path class="pane" d="M214,354 L256,354 L256,366 L214,366 Z"/>

  <!-- ===== ブレーキ ===== -->
  <path class="w" d="M340,288 L372,264"/>
  <circle cx="340" cy="288" r="7" fill="#22262c"/>

  <!-- ===== 座面・背もたれ・アームサポート・グリップ ===== -->
  <path class="seat" d="M296,228 L478,228 L478,244 L296,244 Z"/>
  <path class="pane" d="M478,228 L478,56 L496,56 L496,228 Z"/>
  <path class="w" d="M487,56 L487,30 L538,30"/>
  <path class="pane" d="M324,176 L470,176 L470,190 L324,190 Z"/>
  <path class="w" d="M330,190 L330,228"/>

  <!-- ===== ティッピングレバー ===== -->
  <path class="w" d="M487,300 L590,404"/>
  <path class="w" d="M578,406 L602,406" stroke-width="4"/>

  <!-- ===== ラベル（右） ===== -->
  <circle class="pt" cx="518" cy="30" r="4.5"/><path class="ld" d="M523,30 L690,30"/><text class="lb" x="698" y="36">グリップ</text>
  <circle class="pt" cx="487" cy="110" r="4.5"/><path class="ld" d="M492,110 L690,96"/><text class="lb" x="698" y="102">せもたれ</text>
  <circle class="pt" cx="440" cy="183" r="4.5"/><path class="ld" d="M445,183 L690,162"/><text class="lb" x="698" y="168">アームサポート</text>
  <circle class="pt" cx="452" cy="236" r="4.5"/><path class="ld" d="M457,236 L690,228"/><text class="lb" x="698" y="234">ざめん</text>
  <circle class="pt" cx="582" cy="288" r="4.5"/><path class="ld" d="M587,288 L690,294"/><text class="lb" x="698" y="300">ハンドリム</text>
  <circle class="pt" cx="594" cy="406" r="4.5"/><path class="ld" d="M599,406 L690,382"/><text class="lb" x="698" y="388">ティッピングレバー</text>

  <!-- ===== ラベル（左） ===== -->
  <circle class="pt" cx="340" cy="288" r="4.5"/><path class="ld" d="M335,288 L250,254 L206,254"/><text class="lb" x="198" y="260" text-anchor="end">ブレーキ</text>
  <circle class="pt" cx="235" cy="360" r="4.5"/><path class="ld" d="M230,360 L206,332"/><text class="lb" x="198" y="338" text-anchor="end">フットサポート</text>
  <circle class="pt" cx="278" cy="422" r="4.5"/><path class="ld" d="M273,422 L206,406"/><text class="lb" x="198" y="412" text-anchor="end">キャスター（前輪）</text>
  <circle class="pt" cx="418" cy="410" r="4.5"/><path class="ld" d="M414,414 L330,456 L206,456"/><text class="lb" x="198" y="462" text-anchor="end">くどうりん（後輪）</text>
</svg>
